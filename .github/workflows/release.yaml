name: Publish Release
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
jobs:
  bundle-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rojo/Aftman
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Remodel
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            https://github.com/rojo-rbx/remodel/releases/download/v0.11.0/remodel-0.11.0-linux-x86_64.zip \
            -o remodel.zip
          unzip remodel.zip
          chmod +x remodel
          sudo mv remodel /usr/local/bin/remodel
      - name: Install NPM dependencies
        run: npm install
      - name: Build
        run: |
          npm run compile
          npm run build
      - name: Bundle modules
        run: |
          remodel run ci/bundle.lua public/latest.lua v2.0 minify
          remodel run ci/bundle.lua public/latest.debug.lua v2.0 debug
      - name: Commit latest builds
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: |
            public/latest.lua
            public/latest.debug.lua
          message: "🔥 Release build ${{ github.run_id }} - Auto-build from src [skip ci]"
          push: '--force-with-lease'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: Latest Release
          body: |
            **Auto-built** from commit ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            public/latest.lua
            public/latest.debug.lua
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

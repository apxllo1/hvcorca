name: Publish Release
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'

jobs:
  bundle-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: "master"
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rojo/Aftman
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Remodel
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            https://github.com/rojo-rbx/remodel/releases/download/v0.11.0/remodel-0.11.0-linux-x86_64.zip \
            -o remodel.zip
          unzip remodel.zip
          chmod +x remodel
          sudo mv remodel /usr/local/bin/remodel

      - name: Install NPM dependencies
        run: npm install

      - name: Compile roblox-ts
        run: npm run compile

      - name: Build model
        run: npm run build

      - name: Bundle modules
        run: |
          # Ensure we run this from the repo root where ci/ exists
          remodel run ci/bundle.lua ../Havoc.rbxm ../public/latest.lua release minify
          remodel run ci/bundle.lua ../Havoc.rbxm ../public/latest.debug.lua release-dbg debug

      - name: Commit latest builds
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: |
            public/latest.lua
            public/latest.debug.lua
          message: "🔥 Release v$(date +%Y%m%d-%H%M) - Auto-build from src"
          push: '--force-with-lease'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: Latest Release - ${{ github.sha }}
          body: |
            **Auto-built** from [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            - Minified: [latest.lua](https://github.com/${{ github.repository }}/raw/master/public/latest.lua)
            - Debug: [latest.debug.lua](https://github.com/${{ github.repository }}/raw/master/public/latest.debug.lua)
            - Model: [Havoc.rbxm](https://github.com/${{ github.repository }}/raw/master/Havoc.rbxm)
          draft: false
          prerelease: false
          files: |
            public/latest.lua
            public/latest.debug.lua
            Havoc.rbxm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

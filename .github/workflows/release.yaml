name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rojo/Aftman
        uses: ok-nick/setup-aftman@v0.4.4       # ← updated
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # ↑ this already runs `aftman install` — installs ALL tools from aftman.toml

      # ← REMOVED the broken "aftman install remodel" step

      - name: Install NPM dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Build Rojo project
        run: npm run build

      - name: Bundle release
        run: |
          remodel run ci/bundle.lua public/latest.lua ${{ steps.version.outputs.tag }} hvcorca.rbxm minify
          remodel run ci/bundle.lua public/latest.debug.lua ${{ steps.version.outputs.tag }} hvcorca.rbxm debug

      - name: Commit latest builds
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: |
            public/latest.lua
            public/latest.debug.lua
          message: "🔥 build: ${{ steps.version.outputs.tag }} [skip ci]"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: true                       # ← added
          body: |
            Built from commit ${{ github.sha }}.

            **Quick start:**
            ```lua
            loadstring(game:HttpGetAsync("https://raw.githubusercontent.com/apxllo1/hvcorca/master/public/latest.lua"))()
            ```
          draft: false
          prerelease: false
          files: |
            public/latest.lua
            public/latest.debug.lua
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

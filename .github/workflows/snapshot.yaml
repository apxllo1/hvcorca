name: Publish Nightly Snapshot

on:
  workflow_dispatch:
  # Only run on schedule - pushes to master are handled by the release workflow.
  # The cron runs nightly but the job skips itself if nothing changed in 24h.
  schedule:
    - cron: "0 2 * * *"

jobs:
  bundle-snapshot:
    # Pinned to 22.04 because remodel 0.11.0 (the latest release) links
    # against libssl 1.1, which Ubuntu 24.04 (ubuntu-latest) no longer ships.
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for recent changes
        id: changes
        run: |
          # Skip if nothing in src/ changed in the last 24 hours
          CHANGED=$(git log --since="24 hours ago" --oneline -- src/ | wc -l)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          if [ "$CHANGED" -eq 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No changes in src/ in the last 24h — skipping snapshot."
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rojo/Aftman
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Remodel
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        run: aftman install

      - name: Install NPM dependencies
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Get snapshot tag
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        id: tag
        run: echo "tag=snapshot-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Compile TypeScript
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        run: npm run compile

      - name: Build Rojo project
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Bundle snapshot
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        run: |
          remodel run ci/bundle.lua public/snapshot.lua ${{ steps.tag.outputs.tag }} hvcorca.rbxm minify
          remodel run ci/bundle.lua public/snapshot.debug.lua ${{ steps.tag.outputs.tag }} hvcorca.rbxm debug

      - name: Commit snapshot builds
        if: steps.changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: |
            public/snapshot.lua
            public/snapshot.debug.lua
          message: "🌙 snapshot: ${{ steps.tag.outputs.tag }} [skip ci]"

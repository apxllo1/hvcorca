name: Claude Code
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  claude_check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Claude Code Action
        uses: anthropic-ai/claude-code-action@v1
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

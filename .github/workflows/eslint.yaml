name: ESLint Auto-Fix
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
jobs:
  ESLint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install NPM dependencies
        run: npm install
      - name: Run ESLint Fix
        run: npx eslint src/ --ext .ts,.tsx --fix || true
      - name: Commit Fixed Code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Bot: Fixed formatting and brackets [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
